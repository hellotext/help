        label: Adidas Samba OG
        price: "$ 4.990"
        actions:
        - Ver producto
      - image: "/images/editorial/assets/homepage/figma/sales-product-oversize-tee.png"
        alt: Camiseta de corte amplio
        label: Camiseta oversize
        price: "$ 1.490"
        actions:
        - Ver producto
  id: whatsapp-carousel
whatsapp-shopping:
  type: messages
  label: WhatsApp con productos y botones
  title: Una recomendación completa desde el primer envío.
  caption: 'Ejemplo ilustrativo: la primera recomendación incluye un carrusel con
    dos productos distintos y una acción en cada tarjeta. El texto que lo acompaña
    no repite botones. La consulta posterior aclara el retiro; no hace falta responder
    para explorar o comprar. Los precios y las condiciones son de demostración.'
  panels:
  - label: Recomendación de productos
    channel: whatsapp
    business: Luma
    messages:
    - type: text
      side: business
      text: Ana, tus Samba OG en talle 38 volvieron. Puedes combinarlas con esta camiseta
        y elegir envío o retiro al comprar.
      time: '10:30'
    - type: carousel
      label: Zapatillas y camiseta recomendadas
      products:
      - image: "/images/editorial/assets/homepage/figma/sales-product-samba-og.png"
        alt: Zapatilla Adidas Samba OG de perfil
        label: Adidas Samba OG
        detail: Talle 38 disponible
        price: "$ 4.990"
        actions:
        - Comprar en talle 38
      - image: "/images/editorial/assets/homepage/figma/sales-product-oversize-tee.png"
        alt: Camiseta de corte amplio
        label: Camiseta oversize
        detail: Elige tu talle
        price: "$ 1.490"
        actions:
        - Ver camiseta
    - type: text
      side: customer
      text: "¡Me gustan! ¿Puedo retirar hoy?"
      time: '10:32'
    - type: buttons
      side: business
      text: "¡Sí! Si compras antes de las 15 h, puedes retirar hoy. Elige retiro en
        tienda al finalizar."
      time: '10:33'
      actions:
      - Ver horarios y dirección
  id: whatsapp-shopping
channel-email:
  type: messages
  label: Ejemplo de email
  title: Un aviso de reposición con la identidad de tu marca.
  caption: Email ilustrativo en una vista de Apple Mail, con la identidad y los recursos
