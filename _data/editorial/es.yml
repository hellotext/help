whatsapp-carousel:
  type: messages
  label: WhatsApp con carrusel
  title: Un carrusel para explorar productos.
  caption: Ejemplo ilustrativo de productos en WhatsApp. Desliza el carrusel para
    ver la siguiente opción. Los precios y las acciones son de demostración.
