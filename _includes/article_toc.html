{% if include.collapsible %}
  <details class="article-toc article-toc--collapsible" data-article-toc hidden>
    <summary>{% t on_this_page %}</summary>
    <nav class="article-toc__nav" aria-label="{% t article_navigation %}">
      <ol class="article-toc__list" data-article-toc-list></ol>
    </nav>
  </details>
{% else %}
  <aside class="article-toc" data-article-toc hidden>
    <nav class="article-toc__nav" aria-label="{% t article_navigation %}">
      <h2>{% t on_this_page %}</h2>
      <ol class="article-toc__list" data-article-toc-list></ol>
    </nav>
  </aside>
{% endif %}
