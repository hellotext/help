{% assign guide = include.guide %}
<a href="{{ site.baseurl }}{{ guide.url }}" class="guide-card{% if guide.avatar %} guide-card--with-avatar{% endif %}">
  {% include guide_avatar.html guide=guide size="card" %}
  <div class="guide-card__content">
    {% if include.nested %}
      <h3 class="guide-card__title">{{ guide[site.lang].title }}</h3>
    {% else %}
      <h2 class="guide-card__title">{{ guide[site.lang].title }}</h2>
    {% endif %}
    <p class="guide-card__description">{{ guide[site.lang].description }}</p>
  </div>
</a>
